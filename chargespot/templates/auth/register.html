{% extends 'base.html' %}{% block title %}Register · ChargeSpot{% endblock %}{% block content %}
<div class="auth card"><h1>Create a driver account</h1><form method="post">
<label>Full name</label><input name="name" required>
<label>Email</label><input name="email" type="email" required>
<label>Password (8+ characters, letters and numbers)</label><input name="password" type="password" required>
<p><button style="width:100%">Register</button></p></form>
<p class="muted" style="text-align:center">Already registered? <a href="{{ url_for('auth.login') }}">Log in</a></p></div>{% endblock %}
