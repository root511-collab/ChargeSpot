{% extends 'base.html' %}{% block title %}Log in · ChargeSpot{% endblock %}{% block content %}
<div class="auth card"><h1>Log in to ChargeSpot</h1><form method="post">
<label>Email</label><input name="email" type="email" required autofocus>
<label>Password</label><input name="password" type="password" required>
<p><button style="width:100%">Log in</button></p></form>
<p class="muted" style="text-align:center">New driver? <a href="{{ url_for('auth.register') }}">Create an account</a></p></div>{% endblock %}
